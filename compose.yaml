services:
  lab:
    build: .
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
    environment:
      LAB_API_KEY: ${LAB_API_KEY:?Run python3 -m redhawk init first}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - lab_data:/app/.lab
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.3
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      NODE_OPTIONS: "--max-old-space-size=512"
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "1"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "72"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "250"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - lab
volumes:
  lab_data:
  n8n_data:
